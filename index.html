<!doctype html>
<html lang="en" class="w-full h-full m-0 p-0 overflow-hidden bg-[#131722]">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TradingView Widget - Screenly App</title>
    <script src="screenly.js?version=1"></script>
  </head>
  <body class="w-full h-full m-0 p-0 overflow-hidden bg-[#131722]">
    <div id="app" class="w-screen h-screen">
      <div id="widget-root" class="tradingview-widget-container w-full h-full">
        <div class="tradingview-widget-container__widget w-full h-full"></div>
      </div>

      <div
        id="error-screen"
        class="hidden fixed inset-0 flex items-center justify-center bg-[#131722] text-[#d1d4dc] [font-family:-apple-system,BlinkMacSystemFont,'Segoe_UI',Roboto,sans-serif]"
      >
        <div class="flex gap-8 max-w-[900px] px-12 py-8">
          <div>
            <h2 class="m-0 mb-2 text-2xl">Something went wrong</h2>
            <p class="m-0 leading-normal opacity-85">
              The TradingView widget could not be loaded. Please check your
              configuration or contact your administrator.
            </p>
          </div>
          <div>
            <div class="text-xs uppercase tracking-wider opacity-60 mb-1">
              Error details
            </div>
            <p
              id="error-message"
              class="[font-family:ui-monospace,SFMono-Regular,Menlo,monospace] text-[0.85rem]"
            ></p>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
